version: '3.8'

services:
  ctf-app:
    build:
      context: ./ctf-platform
      dockerfile: Dockerfile
    container_name: akctf-platform
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DATABASE_URL=postgresql://ctf_user:ctf_password@db:5432/ctf_db
    depends_on:
      - db
    volumes:
      - ./ctf-platform/instance:/app/instance
      - ./ctf-platform/static:/app/static
    networks:
      - ctf-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: akctf-db
    environment:
      - POSTGRES_USER=ctf_user
      - POSTGRES_PASSWORD=ctf_password
      - POSTGRES_DB=ctf_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ctf-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ctf-network:
    driver: bridge
