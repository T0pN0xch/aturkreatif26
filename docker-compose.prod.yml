version: '3.8'

services:
  ctf-app:
    build:
      context: ./ctf-platform
      dockerfile: Dockerfile
    container_name: akctf-platform-prod
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - WRITEUP_PASSWORD=${WRITEUP_PASSWORD}
      - FLASK_APP=${FLASK_APP:-ctf-platform/app.py}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ctf-platform/instance:/app/instance
      - ./ctf-platform/static:/app/static
    networks:
      - ctf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  db:
    image: postgres:15-alpine
    container_name: akctf-db-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ctf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
    driver: local

networks:
  ctf-network:
    driver: bridge
