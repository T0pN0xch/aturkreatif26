{% extends "base.html" %}

{% block title %}Login - ATURKREATIF 26 WORKSHOP{% endblock %}

{% block extra_css %}
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .auth-container {
        max-width: 420px;
        margin: 4rem auto;
    }
    
    .auth-card {
        background: var(--white);
        border-radius: 0;
        padding: 2.5rem;
        border: 3px solid var(--bright-red);
        border-top: 6px solid var(--bright-blue);
        box-shadow: 6px 6px 0px rgba(0, 51, 255, 0.2);
        animation: fadeIn 0.6s ease-out;
    }
    
    .auth-card h1 {
        text-align: center;
        margin-bottom: 2rem;
        font-size: 2rem;
        color: var(--bright-red);
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    .auth-card h1::before {
        content: '█ ';
        color: var(--bright-blue);
    }
    
    .auth-links {
        text-align: center;
        margin-top: 1.5rem;
    }
    
    .auth-links a {
        color: var(--bright-red);
        text-decoration: none;
        transition: all 0.3s ease;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .auth-links a:hover {
        color: var(--bright-blue);
        text-decoration: underline;
    }
    
    .auth-links {
        color: var(--dark-text);
    }
    
    .auth-card form {
        display: flex;
        flex-direction: column;
    }
    
    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--dark-text);
        font-size: 0.95rem;
        cursor: pointer;
        font-weight: 600;
    }
    
    input[type="checkbox"] {
        cursor: pointer;
        width: 18px;
        height: 18px;
        accent-color: var(--bright-red);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>LOGIN</h1>
        <form method="POST">
            <div class="form-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember_me"> Remember me
                </label>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">LOGIN</button>
        </form>
        
        <div class="auth-links">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
