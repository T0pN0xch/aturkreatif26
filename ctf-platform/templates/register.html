{% extends "base.html" %}

{% block title %}Register - ATURKREATIF 26 WORKSHOP{% endblock %}

{% block extra_css %}
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .auth-container {
        max-width: 480px;
        margin: 2.5rem auto;
    }
    
    .auth-card {
        background: var(--white);
        border-radius: 0;
        padding: 2.5rem;
        border: 3px solid var(--bright-red);
        border-top: 6px solid var(--bright-blue);
        box-shadow: 6px 6px 0px rgba(0, 51, 255, 0.2);
        animation: fadeIn 0.6s ease-out;
    }
    
    .auth-card h1 {
        text-align: center;
        margin-bottom: 2rem;
        font-size: 2rem;
        color: var(--bright-red);
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    .auth-card h1::before {
        content: '█ ';
        color: var(--bright-blue);
    }
    
    .auth-links {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--dark-text);
    }
    
    .auth-links a {
        color: var(--bright-red);
        text-decoration: none;
        transition: all 0.3s ease;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .auth-links a:hover {
        color: var(--bright-blue);
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>REGISTER</h1>
        <form method="POST">
            <div class="form-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="team_name">TEAM NAME (OPTIONAL)</label>
                <input type="text" id="team_name" name="team_name" placeholder="e.g., Team Alpha">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">REGISTER</button>
        </form>
        
        <div class="auth-links">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
